version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/srs.lpk
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: srs
build:
  run_buildscript: false
images:
  - id: srs
    target: service
    service: srs
    source: ossrs/srs
    channel: custom
    sort: created
    tag_regex: '^v[0-9]+\.[0-9]+-r[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+)-r(?P<patch>[0-9]+)$'
    version_template: '{version}.{patch}'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: SRS
    summary: 支持 RTMP、WebRTC、HLS、SRT 等协议的实时视频服务器
